<div class="w-full xl:w-[380px] bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden flex flex-col">
            <div class="px-5 py-3 border-b border-gray-200 bg-brand-50">
                <h3 class="text-base font-semibold text-brand-800">➕ Adicionar à Lista</h3>
                <p class="text-xs text-brand-600 mt-0.5">Copie do Google Maps e cole aqui</p>
            </div>
            <div class="p-4 overflow-y-auto flex-1">
                <form action="/prospeccao/rascunho/novo" method="POST" id="formLead" class="space-y-3">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="maps_place_id" id="f_maps_place_id">
                    <input type="hidden" name="maps_url" id="f_maps_url">
                    <div>
                        <p class="text-xs text-gray-500">Foco: acessórios de informática. Dados coletados precisam de conferência.</p>
<label class="block text-xs font-medium text-gray-700">Nome da Loja *</label>
                        <input type="text" name="nome_loja" id="f_nome" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-2 border">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700">Endereço</label>
                        <input type="text" name="endereco" id="f_endereco" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-1.5 border">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <div class="flex items-center justify-between">
                                <label class="block text-xs font-medium text-gray-700">Telefone</label>
                                <span id="f_telefone_badge" class="hidden"></span>
                            </div>
                            <input type="text" name="telefone" id="f_telefone" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-1.5 border">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700">WhatsApp</label>
                            <input type="text" name="whatsapp" id="f_whatsapp" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-1.5 border">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700">Responsável</label>
                        <input type="text" name="responsavel" id="f_responsavel" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-1.5 border" placeholder="Nome do contato">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700">CNPJ</label>
                        <input type="text" name="cnpj" id="f_cnpj" autocomplete="off" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-1.5 border" placeholder="00.000.000/0000-00">
                        <div class="mt-2 flex items-center gap-2">
                            <button type="button" onclick="consultarCNPJ()" class="px-3 py-1.5 rounded-md bg-gray-800 text-white text-xs font-medium hover:bg-gray-900">Validar na Receita</button>
                            <button type="button" onclick="preencherDadosCNPJ()" class="px-3 py-1.5 rounded-md bg-brand-600 text-white text-xs font-medium hover:bg-brand-700">Preencher dados</button>
                            <button type="button" id="btnBuscarCnpjGoogle" onclick="buscarCNPJNoGoogle()" disabled class="px-3 py-1.5 rounded-md bg-gray-100 text-gray-500 text-xs font-medium disabled:opacity-60 disabled:cursor-not-allowed hover:bg-gray-200">Buscar CNPJ no Google</button>
                            <span id="cnpjStatus" class="text-xs text-gray-500"></span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div class="col-span-2">
                            <label class="block text-xs font-medium text-gray-700">Cidade</label>
                            <input type="text" name="cidade" id="f_cidade" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-2 border">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700">UF</label>
                            <input type="text" name="estado" id="f_estado" maxlength="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-2 border uppercase">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700">Site</label>
                        <div class="mt-1 flex items-stretch gap-2">
                            <input type="text" name="site" id="f_site" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-2 border" placeholder="ex: empresa.com.br">
                            <button type="button" id="f_site_btn" class="hidden px-3 rounded-md bg-gray-800 text-white text-xs font-medium hover:bg-gray-900">Abrir</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700">Email</label>
                        <input type="email" name="email" id="f_email" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-2 border" placeholder="exemplo@loja.com.br">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700">Segmento</label>
                        <div id="f_segmento" class="mt-1 w-full rounded-md border border-gray-300 shadow-sm px-3 py-2 max-h-40 overflow-y-auto space-y-1">
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Acessórios de informática" checked class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Acessórios de informática</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Informática (Médio Porte)" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Informática (Médio Porte)</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Varejistas de Médio Porte" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Varejistas de Médio Porte</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Informática - Papelaria" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Informática - Papelaria</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Informática - Outlet/Saldão" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Informática - Outlet/Saldão</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Celulares" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Celulares</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Áudio e Vídeo" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Áudio e Vídeo</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Eletroportáteis" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Eletroportáteis</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Eletroportáteis - Outlet/Saldão" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Eletroportáteis - Outlet/Saldão</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Gamer" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Gamer</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Brinquedos" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Brinquedos</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Drones e Câmeras" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Drones e Câmeras</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Ortopédica" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Ortopédica</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Fitness" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Fitness</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Pet" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Pet</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Redes" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Redes</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Mobilidade Elétrica" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Mobilidade Elétrica</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Sennheiser" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Sennheiser</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Utilidades e Variedades" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Utilidades e Variedades</span>
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" name="segmento" value="Multikids" class="rounded border-gray-300 text-brand-600 focus:ring-brand-500">
                                <span>Multikids</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700">Observações</label>
                        <textarea name="observacoes" rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-1.5 border"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700">Status da Ligação *</label>
                        <select name="status_prospeccao" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-1.5 border">
                            <option value="" disabled selected>Selecione um status...</option>
                            <option value="Não contatado">Não contatado</option>
                            <option value="Não atendeu">Não atendeu</option>
                            <option value="Caixa postal">Caixa postal</option>
                            <option value="Enviado Portfólio Whats">Enviado Portfólio Whats</option>
                            <option value="Enviado Portfólio por E-mail">Enviado Portfólio por E-mail</option>
                            <option value="Não analisou ainda o material">Não analisou ainda o material</option>
                            <option value="Pediu para retornar">Agendamento</option>
                            <option value="Solicitou portfólio">Solicitou portfólio</option>
                            <option value="Em negociação">Em negociação</option>
                            <option value="Interessado">Interessado</option>
                            <option value="Aguardando dados para cadastro">Aguardando dados para cadastro</option>
                            <option value="Aguard. Lista Prod.">Aguard. Lista Prod.</option>
                            <option value="Já tem consultor atendendo">Já tem consultor atendendo</option>
                            <option value="Sem interesse">Sem interesse</option>
                            <option value="Descartado">Descartado</option>
                        </select>
                        <p class="text-xs text-gray-500 mt-1">Obrigatório: Marque o resultado do contato</p>
                    </div>

                    <div id="campo-data-retorno" class="hidden">
                        <label class="block text-xs font-medium text-gray-700">Data para Retornar</label>
                        <input type="date" name="data_retorno" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-1.5 border">
                    </div>

                    <div id="campo-hora-retorno" class="hidden">
                        <label class="block text-xs font-medium text-gray-700">Horário para Retornar</label>
                        <input type="time" name="hora_retorno" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-500 focus:ring-brand-500 sm:text-sm px-3 py-1.5 border">
                    </div>

                    <div class="pt-3 border-t border-gray-100">
                        <button type="submit" class="w-full flex justify-center items-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-700">
                            Adicionar à Lista
                        </button>
                    </div>
                </form>
            </div>
        </div>
